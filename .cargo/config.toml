# Git for Windows ships a `link.exe` (GNU hard-link utility) that shadows
# MSVC's linker when building from Git Bash.  Point Cargo at the real one.
[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files\\Microsoft Visual Studio\\18\\Community\\VC\\Tools\\MSVC\\14.50.35717\\bin\\Hostx64\\x64\\link.exe"
