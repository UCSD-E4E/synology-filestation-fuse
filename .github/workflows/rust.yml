name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
    - name: Rust formatting (cargo fmt)
      run: cargo fmt --all -- --check
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: C# formatting (dotnet format)
      run: dotnet format SynologyFuse.sln --verify-no-changes

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Build release (required for installer)
      run: cargo build --release --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r linux-x64 -p:SelfContained=true --output SynologyFuse.Gui/bin/Release/net10.0/linux-x64/publish
    - name: Build deb package
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
        ./SynologyFuse.DebInstaller/Build-Package.sh --version "$VERSION" --out-dir .
    - name: Upload deb package
      uses: actions/upload-artifact@v4
      with:
        name: SynologyFuse-linux-deb
        path: synologyfuse-*.deb

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Build release (required for installer)
      run: cargo build --release --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r osx-arm64 -p:SelfContained=true --output SynologyFuse.Gui/bin/Release/net10.0/osx-arm64/publish
    - name: Build macOS installer
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
        ./SynologyFuse.MacInstaller/Build-Installer.sh --version "$VERSION" --out-dir .
    - name: Upload macOS installer
      uses: actions/upload-artifact@v4
      with:
        name: SynologyFuse-macos-pkg
        path: SynologyFuse-*.pkg

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install WinFsp
      run: choco install winfsp
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Build release (required for installer)
      run: cargo build --release --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r win-x64 -p:SelfContained=true --output SynologyFuse.Gui\bin\Release\net10.0\win-x64\publish
    - name: Install WiX
      run: dotnet tool install --global wix --version 6.0.2
    - name: Build installer
      run: |
        $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1).Line -replace '.*=\s*"(.*)"','$1'
        .\SynologyFuse.Installer\Build-Installer.ps1 -Version $version
