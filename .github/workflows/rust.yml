name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r linux-x64 -p:SelfContained=true

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r osx-arm64 -p:SelfContained=true

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install WinFsp
      run: choco install winfsp
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Build release (required for installer)
      run: cargo build --release --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r win-x64 -p:SelfContained=true
    - name: Install WiX
      run: dotnet tool install --global wix
    - name: Build installer
      run: msbuild SynologyFuse.Installer\SynologyFuse.Installer.wixproj
