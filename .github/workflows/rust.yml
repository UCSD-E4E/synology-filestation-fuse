name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
    - name: Rust formatting (cargo fmt)
      run: cargo fmt --all -- --check
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: C# formatting (dotnet format)
      run: dotnet format SynologyFuse.sln --verify-no-changes

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
    # We restrict Rust CI to the FUSE crate + its `core` library dependency.
    # The Python crate (`python/synology_filestation`) has its own workflow
    # (`python.yml` / `maturin.yml`) and pulling it in here would require
    # Python development headers on macOS/Windows runners just to compile
    # an extension we don't ship via this pipeline.
    - name: Clippy
      run: cargo clippy -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Run Rust tests
      run: cargo test -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Build release (required for installer)
      run: cargo build --release -p synology-filestation-fuse -p synology-filestation-ffi --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r linux-x64 -p:SelfContained=true --output SynologyFuse.Gui/bin/Release/net10.0/linux-x64/publish
    - name: Build deb package
      run: |
        VERSION=$(grep '^version' rust/synology-filestation-fuse/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
        ./SynologyFuse.DebInstaller/Build-Package.sh --version "$VERSION" --out-dir .
    - name: Upload deb package
      uses: actions/upload-artifact@v7
      with:
        name: SynologyFuse-linux-deb
        path: synologyfuse-*.deb

  # The SMB write paths against a real SMB server. Everything else in that
  # crate is mocked or pure, because SMB has no useful in-process fake — and
  # the operations most worth testing (a replacing rename, set-end-of-file,
  # closing a handle nothing was written to) are exactly the ones whose value
  # lies in what the *server* does with them. A mock asserting we sent the
  # right bytes proves the less interesting half.
  #
  # The containers ship inside the smb2 crate for consumers to use, so this
  # needs no fixtures of ours. Linux only: GitHub's macOS and Windows runners
  # have no Docker daemon.
  smb-live:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Start Samba containers and run the ignored SMB tests
      # Serial: every test asks for the same compose project, and concurrent
      # `compose up` calls race each other.
      run: cargo test -p synology-filestation-smb --test samba -- --ignored --test-threads=1 --nocapture
    - name: Container logs on failure
      if: failure()
      run: docker compose ls && docker ps -a

  openvpn-interop:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Install OpenVPN
      # The peer under test. No tun device and no privileges are needed —
      # `--dev null` gives a process that speaks the control channel and has
      # nowhere to put a tunnel afterwards, which is as far as this goes.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openvpn
    - name: Handshake against a real openvpn
      run: cargo test -p synology-filestation-openvpn --test interop -- --ignored --nocapture

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    # We restrict Rust CI to the FUSE crate + its `core` library dependency.
    # The Python crate (`python/synology_filestation`) has its own workflow
    # (`python.yml` / `maturin.yml`) and pulling it in here would require
    # Python development headers on macOS/Windows runners just to compile
    # an extension we don't ship via this pipeline.
    - name: Clippy
      run: cargo clippy -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Run Rust tests
      run: cargo test -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Build release (required for installer)
      run: cargo build --release -p synology-filestation-fuse -p synology-filestation-ffi --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r osx-arm64 -p:SelfContained=true --output SynologyFuse.Gui/bin/Release/net10.0/osx-arm64/publish
    - name: Build macOS installer
      run: |
        VERSION=$(grep '^version' rust/synology-filestation-fuse/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
        ./SynologyFuse.MacInstaller/Build-Installer.sh --version "$VERSION" --out-dir .
    - name: Upload macOS installer
      uses: actions/upload-artifact@v7
      with:
        name: SynologyFuse-macos-pkg
        path: SynologyFuse-*.pkg

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install WinFsp
      run: choco install winfsp
    # We restrict Rust CI to the FUSE crate + its `core` library dependency.
    # The Python crate (`python/synology_filestation`) has its own workflow
    # (`python.yml` / `maturin.yml`) and pulling it in here would require
    # Python development headers on macOS/Windows runners just to compile
    # an extension we don't ship via this pipeline.
    - name: Clippy
      run: cargo clippy -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Run Rust tests
      run: cargo test -p synology-filestation-fuse -p synology-filestation-core -p synology-filestation-ffi -p synology-filestation-smb -p synology-filestation-connect -p synology-filestation-openvpn --verbose
    - name: Build release (required for installer)
      run: cargo build --release -p synology-filestation-fuse -p synology-filestation-ffi --verbose
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Run dotnet tests
      run: dotnet test SynologyFuse.Tests --verbosity normal
    - name: Publish GUI
      run: dotnet publish SynologyFuse.Gui -c Release -r win-x64 -p:SelfContained=true --output SynologyFuse.Gui\bin\Release\net10.0\win-x64\publish
    - name: Install WiX
      run: dotnet tool install --global wix --version 6.0.2
    - name: Build installer
      run: |
        $version = (Select-String -Path rust/synology-filestation-fuse/Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1).Line -replace '.*=\s*"(.*)"','$1'
        .\SynologyFuse.Installer\Build-Installer.ps1 -Version $version
