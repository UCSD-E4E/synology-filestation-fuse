[package]
name = "synology_filestation"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Python bindings for the Synology FileStation HTTP client."
repository = "https://github.com/UCSD-E4E/synology-filestation"

[lib]
name = "synology_filestation"
crate-type = ["cdylib"]

[dependencies]
synology-filestation-core = { path = "../../rust/synology-filestation-core" }
# In-process SMB backend. The client transparently prefers it over the HTTP
# Download/Upload API when reachable, protecting the NAS's shared synoscgi
# backend; falls back to HTTP automatically otherwise.
synology-filestation-smb = { path = "../../rust/synology-filestation-smb" }

# abi3-py310 lets a single Linux wheel cover Python 3.10 through whatever's
# current. Tied to pyproject.toml's `requires-python = ">=3.10"` and the CI
# test matrix (3.10–3.13). pyo3-async-runtimes versions track pyo3 versions.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# pyo3-log routes Rust `log` records into Python's `logging`. tracing-log
# adapts our existing `tracing` events to the `log` crate so the bridge is
# end-to-end.
pyo3-log = "0.13"
tracing-log = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
