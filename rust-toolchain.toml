# The toolchain CI uses.
#
# Without this, CI installs nothing and uses whatever Rust the GitHub runner
# image happens to ship. That image moves on its own schedule, so a clippy
# release can break the repository with no change from anyone — and it lands on
# whichever pull request is open at the time, which is a bad moment to find out
# and a confusing one to debug. That is exactly how 1.98 arrived: a new lint on
# a line nobody had touched since it was written.
#
# Pinned to the current stable rather than to something older, so the lints
# being taken are the current ones. Raising it is then a deliberate act — one
# change that takes the new lints together, rather than whichever pull request
# is unlucky.
#
# ⚠️ This is ahead of the flake's devshell, which nixpkgs currently holds at
# 1.96 (unstable has 1.97). Nix ignores this file, so
# `nix develop -c cargo clippy` asks an older question than CI does and cannot
# see every lint CI can. Closing that gap means bumping the flake's nixpkgs to
# a channel carrying 1.98, and is worth doing when one exists.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
