# The toolchain CI uses.
#
# Without this, CI installs nothing and uses whatever Rust the GitHub runner
# image happens to ship. That image moves on its own schedule, so a clippy
# release can break the repository with no change from anyone — and it lands on
# whichever pull request is open at the time, which is a bad moment to find out
# and a confusing one to debug. That is exactly how 1.98 arrived: a new lint on
# a line nobody had touched since it was written.
#
# Pinned to the current stable rather than to something older, so the lints
# being taken are the current ones. Raising it is then a deliberate act — one
# change that takes the new lints together, rather than whichever pull request
# is unlucky.
#
# The flake reads this file too (`rust-bin.fromRustupToolchainFile`), so
# `nix develop -c cargo clippy` and `nix flake check` ask exactly the question
# CI asks. Before that they did not: the devshell followed
# `rust-bin.stable.latest`, which tracks whenever `rust-overlay` was last
# updated, and the two had drifted far enough that a lint CI failed on could
# not be reproduced locally on any channel.
#
# Raising the version means editing this file and running
# `nix flake update rust-overlay` so the overlay knows about it.
[toolchain]
channel = "1.98.0"
# `rust-src` for the devshell (rust-analyzer); the other two are what
# `cargo fmt --check` and `cargo clippy -- -D warnings` need.
components = ["clippy", "rustfmt", "rust-src"]
