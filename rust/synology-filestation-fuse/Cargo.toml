[package]
name = "synology-filestation-fuse"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Cross-platform filesystem driver mounting Synology FileStation as a local directory."
repository = "https://github.com/UCSD-E4E/synology-filestation"

[lib]
name = "synology_filestation_fuse"
path = "src/lib.rs"

[[bin]]
name = "synology-filestation-fuse"
path = "src/main.rs"

[dependencies]
synology-filestation-core = { path = "../synology-filestation-core" }
synology-filestation-smb = { path = "../synology-filestation-smb" }
synology-filestation-connect = { path = "../synology-filestation-connect" }

tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.13", features = ["json", "multipart", "query", "rustls-no-provider"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
clap        = { version = "4", features = ["derive", "env"] }
libc        = "0.2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes       = "1"
rpassword   = "7"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
moka  = { version = "0.12", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
dav-server   = { version = "0.11", default-features = false }
hyper        = { version = "1", features = ["http1", "server"] }
hyper-util   = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
winfsp     = "0.13"
widestring = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winfsp = "0.13"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# Test-only: the fake write sink implements a core trait that is async.
async-trait = "0.1"
