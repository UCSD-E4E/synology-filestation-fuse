[package]
name = "synology-filestation-openvpn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An in-process OpenVPN client: enough of the protocol to carry SMB to a NAS that terminates the tunnel itself."
repository = "https://github.com/UCSD-E4E/synology-filestation"
# Internal. Nothing outside this workspace speaks this protocol on our behalf.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# What the tunnel negotiated reaches a person only as log output. Without it,
# a tunnel that comes up and then carries nothing is indistinguishable from one
# that landed on the wrong subnet.
tracing = "0.1"
# SHA-512 is what the server is configured with (`auth SHA512` in the published
# .ovpn). See `tls_auth.rs` for why that is a constant here and not a knob.
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# The control channel carries an ordinary TLS session, so an ordinary TLS
# implementation runs on it. `ring` rather than the default provider, matching
# the rest of the workspace: aws-lc-rs wants a C toolchain that the Windows and
# manylinux builds do not have.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The stack test builds the other end of the link out of the same pieces.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }
rustls-pemfile = "2"
# The key derivation is TLS 1.0's PRF, which is MD5 and SHA-1 in parallel.
# Both are long dead as hashes; here they are a fixed part of a wire format we
# do not get to choose, and are used only through HMAC.
# The data channel's cipher, as e4e-nas is configured. Not AEAD: DSM offers
# CBC, so the packet carries a separate HMAC.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
# Session ids have to be unpredictable, not merely distinct.
rand = "0.9"
thiserror = "2"
# The driver owns the socket and the timers. Everything below it stays
# sans-io, which is what let the rest of this crate be tested without a
# network at all.
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
# `PollSender`: what makes the stack's write half an ordinary `AsyncWrite`
# without hand-rolling a reserve-and-poll state machine.
tokio-util = "0.7"

[dev-dependencies]
# The negotiated summary is the crate's only diagnostic surface, so what it
# says is worth asserting on.
tracing-subscriber = "0.3"
hex = "0.4"
# The tests build a few packets the library's own types refuse to represent,
# so they sign them themselves.
hmac = "0.12"
sha2 = "0.10"
# The interop test hands a real `openvpn` a certificate. Generating it here
# rather than shelling out to `openssl` keeps the test's dependencies to the
# one binary it is actually testing against.
rcgen = "0.14"
# The in-process peer in `tests/common` is a rustls server, so the tests need
# rustls directly as well as through the library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Driving the tunnel in a test needs a runtime to drive it on.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The stack test builds the other end of the link out of the same pieces.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }
