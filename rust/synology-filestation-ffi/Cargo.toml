[package]
name = "synology-filestation-ffi"
version = "0.1.19"
edition = "2021"
license = "MIT"
description = "C ABI bindings for the Synology FileStation client and mount driver (consumed by the desktop GUI)."
repository = "https://github.com/UCSD-E4E/synology-filestation"

[lib]
name = "synology_filestation_ffi"
crate-type = ["cdylib"]

[dependencies]
synology-filestation-core = { path = "../synology-filestation-core" }
synology-filestation-smb = { path = "../synology-filestation-smb" }
# The same three legs the CLI has: this consumer used to try SMB at the public
# host and nothing else, so a NAS reachable only through a tunnel was invisible.
synology-filestation-connect = { path = "../synology-filestation-connect" }
synology-filestation-fuse = { path = "../synology-filestation-fuse" }

tokio       = { version = "1", features = ["rt", "rt-multi-thread"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
wiremock = "0.6"
