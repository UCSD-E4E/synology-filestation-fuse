[package]
name = "synology-filestation-core"
version = "0.5.5"
edition = "2021"
license = "MIT"
description = "Pure-Rust async HTTP client for the Synology FileStation API."
repository = "https://github.com/UCSD-E4E/synology-filestation"

[lib]
path = "src/lib.rs"

[dependencies]
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "io-util", "fs"] }
# `form` is what lets login send credentials as a request body instead of a
# query string; like `query`, reqwest 0.13 gates it behind a feature.
reqwest     = { version = "0.13", features = ["json", "multipart", "query", "form", "rustls-no-provider"], default-features = false }
# reqwest 0.13 drops ring as the rustls crypto provider in favour of aws-lc-rs
# (which needs cmake + a C toolchain, and NASM on Windows). We keep the pre-0.13
# ring provider — matching the old `rustls-tls` build footprint so CI needs no
# new build tools — and install it as the process default in `SynologyClient::new`.
rustls      = { version = "0.23", default-features = false, features = ["ring"] }
serde       = { version = "1", features = ["derive"] }
# Verifies an upload that had to resend a slice: DSM hashes the landed file via
# SYNO.FileStation.MD5 and we hash the local one. Pure Rust, no build tooling,
# so the manylinux wheel and the Windows MSVC build stay as they are. Held at
# the 0.11 the workspace already resolves to (smb2 pulls it in for NTLM), so
# this adds no second copy of the digest machinery.
md-5        = "0.11"
serde_json  = "1"
bytes       = "1"
tracing     = "0.1"
async-trait = "0.1"

# libc is only needed for the Linux errno mapping on SynoFsError, used by the
# FUSE backend in the sibling crate. Gating it to Linux keeps the wheel build
# (which targets x86_64 manylinux) lean — no surprise dep pulled in on macOS
# or Windows test runs of the core crate alone.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio   = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
# A self-signed HTTPS listener, so the TLS-verification tests exercise a real
# handshake rather than asserting on a configuration flag. wiremock speaks
# plain HTTP only, hence the hand-rolled listener.
rcgen        = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
