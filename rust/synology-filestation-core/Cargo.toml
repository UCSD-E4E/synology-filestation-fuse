[package]
name = "synology-filestation-core"
version = "0.1.20"
edition = "2021"
license = "MIT"
description = "Pure-Rust async HTTP client for the Synology FileStation API."
repository = "https://github.com/UCSD-E4E/synology-filestation"

[lib]
path = "src/lib.rs"

[dependencies]
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "io-util", "fs"] }
reqwest     = { version = "0.13", features = ["json", "multipart", "query", "rustls-no-provider"], default-features = false }
# reqwest 0.13 drops ring as the rustls crypto provider in favour of aws-lc-rs
# (which needs cmake + a C toolchain, and NASM on Windows). We keep the pre-0.13
# ring provider — matching the old `rustls-tls` build footprint so CI needs no
# new build tools — and install it as the process default in `SynologyClient::new`.
rustls      = { version = "0.23", default-features = false, features = ["ring"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bytes       = "1"
tracing     = "0.1"
async-trait = "0.1"

# libc is only needed for the Linux errno mapping on SynoFsError, used by the
# FUSE backend in the sibling crate. Gating it to Linux keeps the wheel build
# (which targets x86_64 manylinux) lean — no surprise dep pulled in on macOS
# or Windows test runs of the core crate alone.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio   = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
