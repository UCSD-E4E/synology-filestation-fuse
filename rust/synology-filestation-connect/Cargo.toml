[package]
name = "synology-filestation-connect"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Decides how to reach the NAS — SMB, SMB through a tunnel, or the HTTP API — and re-decides when the answer changes."
repository = "https://github.com/UCSD-E4E/synology-filestation"
# Internal: the CLI, the GUI (via the FFI) and the Python bindings all call it,
# but nothing outside this workspace does.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "net", "macros", "fs"] }
tracing = "0.1"
async-trait = "0.1"
# The tunnel profile is fetched over the same authenticated session the rest
# of the chain uses, so this crate speaks to the NAS as well as about it.
synology-filestation-core = { path = "../synology-filestation-core" }
# The tunnel itself. This crate is where the decision layer meets the thing
# that carries out the escalation, so it is the one place that knows both.
synology-filestation-openvpn = { path = "../synology-filestation-openvpn" }
# A password held for as long as a tunnel may need re-raising.
zeroize = "1"


[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
# The bounded-wait test has to get as far as a TLS handshake, so the profile it
# writes needs a certificate that actually parses. Generating one here beats
# committing a real key to a repository.
rcgen = "0.14"
# Log level is behaviour for this crate: which leg was chosen, and why the
# better ones were not, reaches a user only as log output. Asserting on it
# needs the events captured. Same version the CLI and the FFI already use.
tracing-subscriber = "0.3"
